<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Gold gradient -->
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD86A"/>
      <stop offset="0.45" stop-color="#F0A500"/>
      <stop offset="1" stop-color="#B86A00"/>
    </linearGradient>

    <!-- Blue gradient -->
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2D79C7"/>
      <stop offset="1" stop-color="#003366"/>
    </linearGradient>

    <!-- Light blue -->
    <linearGradient id="lightBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F7FF"/>
      <stop offset="1" stop-color="#D7E4FF"/>
    </linearGradient>

    <!-- Shadow -->
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow
        dx="0"
        dy="1.5"
        stdDeviation="1.2"
        flood-opacity="0.35"
      />
    </filter>
  </defs>

  <!-- Background -->
  <circle cx="50" cy="50" r="48" fill="#061F3F"/>
  <circle cx="50" cy="50" r="45" fill="#0A315D"/>

  <!-- Compass outer ring -->
  <circle
    cx="44"
    cy="52"
    r="34"
    fill="none"
    stroke="url(#gold)"
    stroke-width="3"
  />

  <!-- Compass inner ring -->
  <circle
    cx="44"
    cy="52"
    r="28.5"
    fill="#0A315D"
    stroke="#F0A500"
    stroke-width="0.9"
  />

  <!-- Compass ticks -->
  <g stroke="#F0A500" stroke-width="1.1" opacity="0.9">
    <path d="M44 22 L44 26"/>
    <path d="M44 78 L44 82"/>
    <path d="M14 52 L18 52"/>
    <path d="M70 52 L74 52"/>
    <path d="M23 31 L26 34"/>
    <path d="M62 70 L65 73"/>
    <path d="M23 73 L26 70"/>
  </g>

  <!-- Main compass points -->
  <g filter="url(#shadow)">
    <polygon
      points="44,18 49,49 44,77 39,49"
      fill="url(#gold)"
    />

    <polygon
      points="15,52 40,47 74,52 40,57"
      fill="url(#gold)"
    />
  </g>

  <!-- Pale inner facets -->
  <polygon
    points="44,23 47,49 44,70 41,49"
    fill="url(#lightBlue)"
  />

  <polygon
    points="21,52 40,49 65,52 40,55"
    fill="url(#lightBlue)"
  />

  <!-- Blue diagonal navigation arrow -->
  <polygon
    points="24,75 43,48 76,22 50,51"
    fill="url(#blue)"
    stroke="#F0A500"
    stroke-width="1.2"
  />

  <polygon
    points="43,49 50,51 28,69"
    fill="#D8E6FF"
    opacity="0.9"
  />

  <!-- Wing -->
  <g
    fill="url(#blue)"
    stroke="#F0A500"
    stroke-width="1.15"
    filter="url(#shadow)"
  >
    <path
      d="M50 49
         C60 43 69 34 81 22
         C78 34 70 44 61 50
         C69 46 79 40 88 31
         C84 44 76 51 64 55
         C72 53 82 49 90 44
         C86 58 75 63 60 59 Z"
    />

    <path
      d="M53 53
         C64 50 73 47 83 44
         C77 56 68 60 57 59 Z"
    />
  </g>

  <!-- Wing highlights -->
  <g
    fill="none"
    stroke="#D9E8FF"
    stroke-width="0.9"
    opacity="0.95"
  >
    <path d="M59 48 C67 42 73 36 79 29"/>
    <path d="M61 52 C70 49 77 45 84 38"/>
    <path d="M61 56 C69 55 76 52 84 48"/>
  </g>

  <!-- Center hub -->
  <circle
    cx="44"
    cy="52"
    r="8.2"
    fill="#062957"
    stroke="#F0A500"
    stroke-width="2"
  />

  <!-- Center star -->
  <polygon
    points="44,44 46.2,49.8 52,52 46.2,54.2 44,60
            41.8,54.2 36,52 41.8,49.8"
    fill="#F0A500"
  />

  <!-- Star center highlight -->
  <circle
    cx="44"
    cy="52"
    r="1.4"
    fill="#FFF3C4"
  />

</svg>
